# ============================================================================
# STANDALONE FKOORA STACK - run from the repository root
# ============================================================================
# The whole match center in one command (PostgreSQL + Redis + one-shot
# migration init + read-only API + scraper worker + Next.js frontend):
#
#   docker compose up -d --build
#   docker compose logs -f fkoora-migrate    # TEXT->TIMESTAMPTZ report
#   docker compose logs -f fkoora-worker     # scheduler ticks, live syncs
#
# Then open http://localhost:3000 (frontend :3000 is the ONLY port a
# browser needs; postgres is optionally exposed on 127.0.0.1:5433 for psql).
#
# Service roles (all backend containers share ONE image, Dockerfile.api):
#
#   fkoora-postgres  source of truth. Data survives restarts in the
#                    ./postgres-data bind volume.
#   fkoora-redis     response cache + LIVE layer: the API caches JSON
#                    responses (fk:api:v1:*, TTL'd) and the worker
#                    maintains fk:live:v1:* + publishes SSE events on
#                    fk:events:v1:matches. volatile-lru: only TTL'd keys
#                    (the cache) are ever evicted - the TTL-less SSE
#                    replay keys (fk:live:v1:seq / :log) survive memory
#                    pressure. Nothing persisted; losing it is a cache
#                    miss, not data loss.
#   fkoora-migrate   ONE-SHOT init container: idempotent schema +
#                    legacy TEXT -> TIMESTAMPTZ/DATE conversion, exits 0.
#                    api + worker gate on its clean exit so they never
#                    race each other's ALTERs on an existing volume.
#   fkoora-api       READ-ONLY gunicorn API (:9000, container-internal).
#                    Serves the frontend from PostgreSQL; records data
#                    gaps as refresh_jobs rows; fans out live updates via
#                    GET /api/events/live (SSE, one Redis subscription
#                    per process). NEVER scrapes goal.com.
#   fkoora-worker    the ONLY process that talks to goal.com: freshness
#                    scheduler + refresh_jobs consumer, adaptive provider
#                    polling (LIVE 60s / upcoming 120s / idle 300s),
#                    writes live state to Redis after every COMMITTED
#                    change. WITHOUT THIS CONTAINER THE DATA GOES STALE.
#   fkoora-frontend  Next.js (standalone) on :3000. Proxies every /api/*
#                    call - including the SSE stream - to the API
#                    server-side; the browser never sees the backend.
#
# One-time historical bootstrap (10 years back, resumable) - uncomment in
# the worker environment: BOOTSTRAP_ON_START: "1" (runs in the background
# in parallel with everything else; docker compose logs + worker log file).
#
# Production variant with your full reverse-proxy/homelab stack around it:
# docker-compose.fkoora-full.yml (same services, plus your NPM/MariaDB/...).
# ============================================================================
services:
  fkoora-postgres:
    image: postgres:16-alpine
    container_name: fkoora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fkoora
      POSTGRES_USER: fkoora
      POSTGRES_PASSWORD: fkoora_dev_password
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"       # local psql only, never published
    networks:
      - fkoora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fkoora -d fkoora"]
      interval: 10s
      timeout: 5s
      retries: 5

  fkoora-redis:
    image: redis:7-alpine
    container_name: fkoora_redis
    restart: unless-stopped
    # volatile-lru (NOT allkeys-lru): evicts only TTL-carrying keys (the
    # response cache fk:api:v1:* + live hot keys fk:live:v1:match:*), never
    # the TTL-less fk:live:v1:seq / :log keys SSE replay depends on.
    command: ["redis-server", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-lru",
              "--save", "", "--appendonly", "no"]
    networks:
      - fkoora-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # one-shot init container - idempotent, re-runs (as a fast no-op) on
  # every `docker compose up`. `restart: "no"` is QUOTED on purpose: a
  # bare YAML `no` parses as boolean false and compose rejects it.
  fkoora-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fkoora_migrate
    restart: "no"
    environment:
      SERVICE_ROLE: migrate
      FOOTBALL_DB_URL: postgresql://fkoora:fkoora_dev_password@fkoora-postgres:5432/fkoora
    networks:
      - fkoora-net
    depends_on:
      fkoora-postgres:
        condition: service_healthy

  fkoora-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fkoora_api
    restart: unless-stopped
    # gunicorn drains in-flight requests + open SSE streams for up to 30s
    # (GUNICORN_GRACEFUL_TIMEOUT, see docker-entrypoint.sh) - give docker's
    # SIGTERM a little longer before SIGKILL.
    stop_grace_period: 35s
    environment:
      SERVICE_ROLE: api
      FOOTBALL_DB_URL: postgresql://fkoora:fkoora_dev_password@fkoora-postgres:5432/fkoora
      # response cache + live layer (degrade-safe: unset = plain DB reads
      # and SSE falls back to a server-side DB poll)
      REDIS_URL: redis://fkoora-redis:6379/0
      # API_CRON_SECRET: ""         # protects /api/cron/refresh when set
      # SSE / live tuning (defaults shown):
      # SSE_HEARTBEAT_SEC: "15"     # keep << any reverse proxy's read
      #                              # timeout (nginx default 60s)
      # GUNICORN_THREADS: "32"      # ~1 thread per concurrent SSE client
    volumes:
      - ./img_cache:/app/img_cache   # crest/logo cache survives restarts
    networks:
      - fkoora-net
    depends_on:
      fkoora-postgres:
        condition: service_healthy
      fkoora-redis:
        condition: service_healthy
      fkoora-migrate:
        condition: service_completed_successfully

  fkoora-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fkoora_worker
    restart: unless-stopped
    stop_grace_period: 35s        # let the current provider sync commit
    environment:
      SERVICE_ROLE: worker
      FOOTBALL_DB_URL: postgresql://fkoora:fkoora_dev_password@fkoora-postgres:5432/fkoora
      REDIS_URL: redis://fkoora-redis:6379/0
      # one-time 10-year historical walk (background, resumable):
      # BOOTSTRAP_ON_START: "1"
      # adaptive provider polling (defaults shown):
      # ADAPTIVE_POLL: "1"
      # PROVIDER_POLL_IDLE_SECONDS: "300"
      # PROVIDER_POLL_UPCOMING_SECONDS: "120"
      # PROVIDER_POLL_LIVE_SECONDS: "60"
      # SCHEDULER_ROLE: auto       # leader election if you run >1 worker
    volumes:
      - ./img_cache:/app/img_cache   # shared with the API (pre-warm)
    networks:
      - fkoora-net
    depends_on:
      fkoora-postgres:
        condition: service_healthy
      fkoora-redis:
        condition: service_healthy
      fkoora-migrate:
        condition: service_completed_successfully

  fkoora-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fkoora_frontend
    restart: unless-stopped
    environment:
      # container-to-container, server-side only; the browser only talks
      # to this Next.js server, which proxies /api/* (incl. SSE) to the API
      FOOTBALL_API_BASE: http://fkoora_api:9000
      # CRON_SECRET: ""            # must match API_CRON_SECRET when set
      # SITE_URL: https://fkoora.site  # runtime canonical-URL override
    ports:
      - "3000:3000"
    networks:
      - fkoora-net
    depends_on:
      fkoora-api:
        condition: service_healthy

networks:
  fkoora-net:
    driver: bridge
