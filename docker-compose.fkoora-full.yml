# ============================================================================
# YOUR STACK + THE FKOORA MIGRATION (api/scraper split + shared Redis cache)
# ============================================================================
# This is your existing docker-compose.yml with ONLY the fkoora block
# modernized. Everything else (NPM, MariaDB, OpenLiteSpeed, tauri-portal,
# adminer, redis, Immich, oscam) is untouched - diff this file against yours
# to see the changes.
#
# What changed and why:
#
#   fkoora-api       now READ-ONLY (SERVICE_ROLE: api). The scraper/scheduler
#                    moved out of this container; the old
#                    API_ENABLE_SCHEDULER/BOOTSTRAP_ON_START comments are dead.
#                    + REDIS_URL: response cache in front of PostgreSQL (a hit
#                    costs ONE Redis GET instead of the SQL chain).
#   fkoora-worker    NEW. Same image as the API, SERVICE_ROLE=worker: the
#                    freshness scheduler + refresh_jobs consumer - the ONLY
#                    process that talks to goal.com. It also DELs the cache
#                    keys the moment fresh data lands (so a hit is never a
#                    stale score). WITHOUT THIS CONTAINER THE DATA GOES STALE.
#   fkoora-redis     NEW. Dedicated cache instance (256 MB, nothing on
#                    disk) - same pattern as your immich-redis.
#                    ALSO carries the LIVE layer since the Fkoora upgrade:
#                    the worker maintains fk:live:v1:* (live hot cache +
#                    event log) and publishes to fk:events:v1:matches; the
#                    API's /api/events/live SSE endpoint fans those out to
#                    every browser (one Redis subscription per process).
#                    The eviction policy is VOLATILE-lru, NOT allkeys-lru:
#                    volatile-* only evicts keys that carry a TTL (the
#                    fk:api:v1:* response cache + the fk:live:v1:match:*
#                    hot keys, all short-lived and cheap to rebuild) and
#                    NEVER touches the TTL-less fk:live:v1:seq / :log keys
#                    that SSE Last-Event-ID replay depends on. Keeping it
#                    dedicated means eviction can never touch the keys of
#                    your shared `redis` service. Alternative: drop this
#                    service and set REDIS_URL: redis://redis:6379/0 on
#                    api + worker (fkoora keys are namespaced fk:api:v1:*
#                    and all carry TTLs) - but then keep that instance's
#                    policy non-evicting for TTL-less keys (no allkeys-*).
#   fkoora-migrate    NEW. One-shot init container from the same image
#                    (SERVICE_ROLE=migrate): applies the idempotent schema
#                    and the TEXT -> TIMESTAMPTZ/DATE conversion for legacy
#                    databases, prints a report, exits 0. api + worker gate
#                    on it (service_completed_successfully) so they never
#                    race each other's ALTERs on your existing
#                    ./postgres-data volume; on an already-migrated
#                    database it is a seconds-long no-op. Idempotent:
#                    every `docker compose up` simply re-runs it.
#   fkoora-postgres  untouched (same ./postgres-data volume - your data
#                    survives; the two new coordination tables apply
#                    themselves on first start).
#   fkoora-frontend  untouched (it already proxies every /api/* call to
#                    fkoora_api:9000 server-side).
#
# Deploy (rebuild is required - requirements.txt gained the redis package):
#
#   docker compose up -d --build fkoora-redis fkoora-migrate \
#                          fkoora-api fkoora-worker
#   docker compose logs -f fkoora-migrate    # type conversion report
#   docker compose logs -f fkoora-worker    # scheduler ticks
#
# NOTE - SSE through nginx-proxy-manager: the API and the Next.js proxy both
# send `X-Accel-Buffering: no` (nginx then streams /api/events/live instead
# of buffering it) and the stream heartbeats every SSE_HEARTBEAT_SEC (15s),
# well under nginx's default 60s proxy_read_timeout - no custom NPM config
# needed. If you raised SSE_HEARTBEAT_SEC above ~50s, also raise
# proxy_read_timeout in the NPM custom location config.
#
# ============================================================================

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginxproxymanager
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./nginx-proxy-manager/data:/data
      - ./nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - webnet
    depends_on:
      - db
      - openlitespeed

  db:
    image: mariadb:10.11
    container_name: mariadb
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: devdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass123
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - webnet

  openlitespeed:
    build: .
    container_name: openlitespeed
    restart: always
    ports:
      - "8080:80"
      - "7080:7080"
    volumes:
      - ./wordpress/www:/var/www/vhosts/localhost/html
      - ./ols/conf:/usr/local/lsws/conf
      - ./ols/logs:/usr/local/lsws/logs
    networks:
      - webnet
    depends_on:
      - db
  tauri-portal:
    image: webdevops/php-nginx:8.3
    container_name: tauri_portal
    restart: always
    working_dir: /var/www/html
    environment:
      WEB_DOCUMENT_ROOT: /var/www/html/public
    env_file:
      - ./tauri-portal/.env
    volumes:
      - ./tauri-portal:/var/www/html
    ports:
      - "8000:80"
    networks:
      - webnet
      - internal
    depends_on:
      - db

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    networks:
      - webnet
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - webnet


  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: always
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: immichpass
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - /mnt/storage2/immich/uploads:/usr/src/app/upload
    ports:
      - "3001:2283" # local access only
    networks:
      - webnet
    depends_on:
      - immich-db
      - immich-redis

  immich-microservices:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_microservices
    restart: always
    command: ["start.sh", "microservices"]
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: immichpass
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      NODE_ENV: production
    volumes:
      - /mnt/storage2/immich/uploads:/usr/src/app/upload
    networks:
      - webnet
    depends_on:
      - immich-db
      - immich-redis

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_ml
    restart: always
    volumes:
      - /mnt/storage2/immich/uploads:/usr/src/app/upload
    networks:
      - webnet

  immich-redis:
    image: redis:7-alpine
    container_name: immich_redis
    restart: always
    networks:
      - webnet

  immich-db:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich_db
    restart: always
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immichpass
      POSTGRES_DB: immich
    volumes:
      - ./immich/db:/var/lib/postgresql/data
    networks:
      - webnet

  oscam:
    image: lscr.io/linuxserver/oscam:latest
    container_name: oscam
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./oscam:/config
    ports:
      - 8888:8888
      - 12300:12300
    restart: unless-stopped

  fkoora-postgres:
    image: postgres:16-alpine
    container_name: fkoora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fkoora
      POSTGRES_USER: fkoora
      POSTGRES_PASSWORD: fuckkoora
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fkoora -d fkoora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEW - dedicated response cache + live layer for fkoora (same pattern as
  # immich-redis): bounded to 256 MB, nothing persisted. Losing it just means
  # cache misses rebuild from PostgreSQL. volatile-lru (NOT allkeys-lru!):
  # only TTL-carrying keys are evictable - the response cache
  # (fk:api:v1:*, all TTL'd) and the live hot keys (fk:live:v1:match:*,
  # TTL 300s, rewritten every sync) - while the TTL-less SSE replay keys
  # (fk:live:v1:seq + :log) survive memory pressure untouched. Keep it
  # SEPARATE from the shared `redis` service above so eviction can never
  # touch its keys; or delete this service and point REDIS_URL (on api +
  # worker) at redis://redis:6379/0 instead - but then that instance must
  # not use an allkeys-* policy.
  fkoora-redis:
    image: redis:7-alpine
    container_name: fkoora_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-lru",
              "--save", "", "--appendonly", "no"]
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NEW - one-shot init container (same image, SERVICE_ROLE=migrate):
  # applies the idempotent schema + converts legacy TEXT date/timestamp
  # columns to TIMESTAMPTZ/DATE, prints a report, exits 0. Idempotent and
  # safe to re-run on every `up`; on a fresh database it only creates the
  # tables (already native types). api/worker below gate on its clean exit
  # so they start against a fully typed database instead of racing each
  # other's ALTERs. `restart: "no"` (quoted - bare no parses as YAML false).
  fkoora-migrate:
    build:
      context: ./fkoora
      dockerfile: Dockerfile.api
    container_name: fkoora_migrate
    restart: "no"
    environment:
      SERVICE_ROLE: migrate
      FOOTBALL_DB_URL: postgresql://fkoora:fuckkoora@fkoora-postgres:5432/fkoora
      # SCHEMA_LOCK_TIMEOUT_SEC: "10"   # default 5 - raise if the first
      #                                  # ALTER ever times out behind a
      #                                  # long-running write lock
    networks:
      - webnet
    depends_on:
      fkoora-postgres:
        condition: service_healthy

  fkoora-api:
    build:
      context: ./fkoora
      dockerfile: Dockerfile.api
    container_name: fkoora_api
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      # READ-ONLY JSON API (gunicorn :9000, internal to webnet only). It
      # serves what the DB has and records data gaps as refresh_jobs rows -
      # it never scrapes goal.com anymore (that is the worker's job below).
      SERVICE_ROLE: api
      FOOTBALL_DB_URL: postgresql://fkoora:fuckkoora@fkoora-postgres:5432/fkoora
      # Shared response cache: a hit is ONE Redis GET instead of the SQL
      # chain; the worker drops affected keys the moment data changes.
      # Leave it unset to run cache-less (plain DB reads, still correct).
      REDIS_URL: redis://fkoora-redis:6379/0
      # API_CRON_SECRET: ""        # protects /api/cron/refresh when set
      # SSE / live tuning (defaults shown, see scraper/sse.py + live.py):
      # SSE_HEARTBEAT_SEC: "15"    # keep-alive cadence - keep << 60s
      #                              # (nginx proxy_read_timeout)
      # GUNICORN_THREADS: "32"     # ~1 thread per concurrent SSE client
      #                              # + headroom for plain requests
    volumes:
      - ./fkoora/img_cache:/app/img_cache   # crest/logo cache survives restarts
    networks:
      - webnet
    depends_on:
      fkoora-postgres:
        condition: service_healthy
      fkoora-redis:
        condition: service_healthy
      fkoora-migrate:
        condition: service_completed_successfully

  # NEW - the scraper worker. Same image as fkoora-api, different role: runs
  # the freshness scheduler + consumes refresh_jobs (the API enqueues them).
  # The ONLY process that talks to goal.com. No ports - it never serves HTTP.
  fkoora-worker:
    build:
      context: ./fkoora
      dockerfile: Dockerfile.api
    container_name: fkoora_worker
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      SERVICE_ROLE: worker
      FOOTBALL_DB_URL: postgresql://fkoora:fuckkoora@fkoora-postgres:5432/fkoora
      REDIS_URL: redis://fkoora-redis:6379/0   # invalidates the API cache on write
      # BOOTSTRAP_ON_START: "1"    # set to "1" for the one-time 10-year walk
      # SCHEDULER_ROLE: auto       # leader election if you run >1 worker
      # Adaptive provider polling (recomputed per tick from DB state):
      # ADAPTIVE_POLL: "1"
      # PROVIDER_POLL_IDLE_SECONDS: "300"      # nothing live, nothing coming
      # PROVIDER_POLL_UPCOMING_SECONDS: "120"  # kickoff inside lookahead window
      # PROVIDER_POLL_LIVE_SECONDS: "60"       # at least one match LIVE
      # LIVE_TTL_SEC: "300" / LIVE_LOG_MAXLEN: "1000"
    volumes:
      - ./fkoora/img_cache:/app/img_cache     # shared with the API (pre-warm)
    networks:
      - webnet
    depends_on:
      fkoora-postgres:
        condition: service_healthy
      fkoora-redis:
        condition: service_healthy
      fkoora-migrate:
        condition: service_completed_successfully

  fkoora-frontend:
    build:
      context: ./fkoora
      dockerfile: Dockerfile.frontend
    container_name: fkoora_frontend
    restart: unless-stopped
    environment:
      # Container-to-container (server side); the browser only ever talks to
      # this Next.js server - it proxies every /api/* call (including the
      # /api/events/live SSE pass-through) to the Flask API.
      FOOTBALL_API_BASE: http://fkoora_api:9000
      # CRON_SECRET: ""              # must match API_CRON_SECRET when set
      # SITE_URL: https://fkoora.site # runtime canonical-URL override
    ports:
     - "3000:3000"
    networks:
      - webnet
    depends_on:
      fkoora-api:
        condition: service_healthy

networks:
  webnet:
    driver: bridge
  internal:
    driver: bridge
